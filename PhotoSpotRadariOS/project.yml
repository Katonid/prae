name: PhotoSpotRadar
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: NO
    # Versionierung: Patch zählt bei jeder Änderungsrunde automatisch hoch (1.1.0 → 1.1.1 → …),
    # größere Sprünge (1.2.0, 2.0.0) nur bei entsprechendem Funktionsumfang. Build-Nummer je Release +1.
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 1.1.6
packages:
  PhotoSpotCore:
    path: .
targets:
  PhotoSpotRadar:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: PhotoSpotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhotoSpotRadar
        PRODUCT_NAME: PhotoSpot Radar
        PRODUCT_MODULE_NAME: PhotoSpotRadar
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/PhotoSpotRadar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  PhotoSpotRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PhotoSpotRadar
      - package: PhotoSpotCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhotoSpot Radar.app/PhotoSpot Radar"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PhotoSpotRadar:
    build:
      targets:
        PhotoSpotRadar: all
        PhotoSpotRadarTests: [test]
    test:
      targets: [PhotoSpotRadarTests]
