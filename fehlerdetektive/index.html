<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fehlerdetektive">
<title>Fehlerdetektive</title>
<style>
  :root {
    --hintergrund: #f6f4ee;
    --karte: #ffffff;
    --text: #1f2430;
    --leise: #5a6170;
    --rand: #e2ddd0;
    --akzent: #2f5d8a;
    --akzent-dunkel: #234870;

    /* Markierung vor der Auswertung */
    --markiert-bg: #ffe27a;
    --markiert-linie: #8a6a00;

    /* Auswertung – Farbe UND Linienart, damit es auch ohne Farbsehen klappt */
    --gefunden-bg: #c9ecd3;
    --gefunden-linie: #1d7a3e;
    --falsch-bg: #fbd3d0;
    --falsch-linie: #b3261e;
    --uebersehen-bg: #ffdcb0;
    --uebersehen-linie: #a85400;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--hintergrund);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    padding: 0 max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
  }

  .seite {
    max-width: 46rem;
    margin: 0 auto;
  }

  header {
    padding: 32px 0 8px;
  }

  h1 {
    font-size: clamp(1.6rem, 1.1rem + 2vw, 2.25rem);
    line-height: 1.2;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  h1 .lupe { font-weight: 400; }

  .auftrag {
    font-size: clamp(1.1rem, 1rem + 0.4vw, 1.25rem);
    margin: 0 0 6px;
  }

  .auftrag.achtung {
    color: var(--leise);
  }

  .auftrag strong { color: var(--text); }

  /* Ergebnis der Auswertung */
  .ergebnis {
    margin: 20px 0 0;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--karte);
    border: 2px solid var(--rand);
    font-size: 1.2rem;
  }
  .ergebnis[hidden] { display: none; }
  .ergebnis p { margin: 0 0 4px; }
  .ergebnis p:last-child { margin-bottom: 0; }
  .ergebnis .haupt { font-weight: 700; font-size: 1.3rem; }
  .ergebnis.perfekt {
    border-color: var(--gefunden-linie);
    background: #effaf2;
  }
  .ergebnis .tipp {
    color: var(--leise);
    font-size: 1rem;
    margin-top: 10px;
  }

  .legende {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin: 14px 0 0;
    padding: 0;
    list-style: none;
    font-size: 1rem;
  }
  .legende li { display: flex; align-items: center; gap: 8px; }
  .legende .probe {
    display: inline-block;
    width: 2.2em;
    height: 1.2em;
    border-radius: 4px;
  }

  /* Zählerleiste – bleibt beim Lesen oben sichtbar */
  .leiste {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--hintergrund);
    padding: 12px 0 10px;
    margin-top: 12px;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--leise);
  }
  .leiste strong { color: var(--text); }

  /* Textkarte */
  .textkarte {
    position: relative;
    background: var(--karte);
    border: 1px solid var(--rand);
    border-radius: 16px;
    padding: clamp(20px, 4vw, 40px) clamp(18px, 5vw, 48px);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  .textkarte h2 {
    font-size: clamp(1.35rem, 1.1rem + 1vw, 1.7rem);
    margin: 0 0 18px;
    line-height: 1.3;
  }

  .text {
    font-size: clamp(1.25rem, 1.05rem + 0.8vw, 1.5rem);
    line-height: 2.1;
    hyphens: manual;
    -webkit-hyphens: manual;
    overflow-wrap: break-word;
    /* Kein Lupen-/Auswahlmenü bei langem Druck auf dem iPad */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .text p { margin: 0 0 1em; }
  .text p:last-child { margin-bottom: 0; }

  /* Ein antippbares Wort – sieht aus wie normaler Text */
  .w {
    cursor: pointer;
    border-radius: 6px;
    /* größere Tippfläche, ohne den Textfluss zu verschieben */
    padding: 0.18em 0.12em;
    margin: 0 -0.12em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .w:focus { outline: none; }
  .w:focus-visible {
    outline: 3px solid var(--akzent);
    outline-offset: 1px;
  }

  @media (hover: hover) and (pointer: fine) {
    .uebung:not(.ausgewertet) .w:not(.gefunden):not(.falsch):hover { background: #f1eee4; }
  }

  .w.markiert,
  .uebung:not(.ausgewertet) .w.markiert:hover {
    background: var(--markiert-bg);
    box-shadow: inset 0 -3px 0 var(--markiert-linie);
  }

  /* Nach der Auswertung */
  .ausgewertet .w { cursor: default; }
  .ausgewertet .w.markiert { background: none; box-shadow: none; }

  /* Grün und Rot gibt es schon beim Prüfen (Stufe 1–3), Orange erst mit
     der Lösung. */
  .w.gefunden,
  .ausgewertet .w.uebersehen,
  .w.falsch { cursor: pointer; }

  .w.gefunden {
    background: var(--gefunden-bg);
    box-shadow: inset 0 -3px 0 var(--gefunden-linie);
  }
  .w.falsch {
    background: var(--falsch-bg);
    text-decoration: line-through;
    text-decoration-color: var(--falsch-linie);
    text-decoration-thickness: 2px;
  }
  .ausgewertet .w.uebersehen {
    background: var(--uebersehen-bg);
    box-shadow: inset 0 0 0 2px var(--uebersehen-linie);
  }
  .ausgewertet .w.offen {
    outline: 3px solid var(--akzent);
    outline-offset: 1px;
  }

  /* Stufe 3: Bänder über die Zeilen, in denen noch ein Fehler steckt —
     unter dem Text, über die ganze Breite. */
  .baender { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .band {
    position: absolute;
    border-radius: 8px;
    background: rgba(250, 204, 21, 0.3);
    box-shadow: inset 4px 0 0 #b7791f;
  }
  .textkarte h2, .text { position: relative; z-index: 1; }
  .ergebnis .tippzeile { font-weight: 700; }
  .naechstes { margin: 12px auto 0; max-width: 30rem; text-align: center; color: var(--leise); font-size: 1rem; }
  .naechstes[hidden] { display: none; }

  .probe.gefunden { background: var(--gefunden-bg); box-shadow: inset 0 -3px 0 var(--gefunden-linie); }
  .probe.falsch { background: var(--falsch-bg); background-image: linear-gradient(transparent 45%, var(--falsch-linie) 45%, var(--falsch-linie) 58%, transparent 58%); }
  .probe.uebersehen { background: var(--uebersehen-bg); box-shadow: inset 0 0 0 2px var(--uebersehen-linie); }

  /* Einblendung mit der richtigen Schreibweise */
  .blase {
    position: absolute;
    z-index: 10;
    max-width: min(22rem, calc(100% - 16px));
    background: #1f2430;
    color: #fff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 1.25rem;
    line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }
  .blase[hidden] { display: none; }
  .blase .alt { text-decoration: line-through; text-decoration-thickness: 2px; opacity: 0.85; }
  .blase .neu { font-weight: 700; color: #b9f0c8; }
  .blase .hinweis { display: block; font-size: 1rem; opacity: 0.85; margin-top: 2px; }
  .blase::before {
    content: "";
    position: absolute;
    top: -8px;
    left: var(--pfeil, 50%);
    margin-left: -8px;
    border: 8px solid transparent;
    border-top: 0;
    border-bottom-color: #1f2430;
  }

  /* Knöpfe */
  .knoepfe {
    display: flex;
    justify-content: center;
    margin: 28px 0 0;
  }

  button.gross {
    font: inherit;
    font-size: 1.35rem;
    font-weight: 700;
    min-height: 60px;
    min-width: min(100%, 18rem);
    padding: 14px 32px;
    border-radius: 14px;
    border: 0;
    background: var(--akzent);
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button.gross:active { background: var(--akzent-dunkel); }
  button.gross:focus-visible { outline: 3px solid #f0b400; outline-offset: 3px; }
  button.gross.zweit {
    background: var(--karte);
    color: var(--akzent);
    border: 2px solid var(--akzent);
  }
  button.gross.zweit:active { background: #e9eff6; }
  button[hidden] { display: none; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .seite[hidden] { display: none; }

  /* Auswahl der Übungen */
  .wahl { display: grid; gap: 16px; margin-top: 24px; }
  .wahlknopf {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    min-height: 88px;
    padding: 18px 22px;
    font: inherit;
    text-align: left;
    color: var(--text);
    background: var(--karte);
    border: 2px solid var(--rand);
    border-radius: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .wahlknopf:active { border-color: var(--akzent); background: #f3f6fa; }
  .wahlknopf:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
  .wahlknopf__nummer { font-size: 1.4rem; font-weight: 800; color: var(--akzent); white-space: nowrap; }
  .wahlknopf__titel { flex: 1; font-size: 1.25rem; font-weight: 600; }
  .wahlknopf__pfeil { font-size: 1.5rem; color: var(--leise); }

  button.zurueck {
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--akzent);
    background: none;
    border: 0;
    padding: 10px 0;
    min-height: 44px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--leise);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="seite" id="auswahl">
  <header>
    <h1>Fehlerdetektive <span class="lupe" aria-hidden="true">🔍</span></h1>
    <p class="auftrag">Such dir eine Übung aus.</p>
  </header>
  <nav class="wahl" id="wahl" aria-label="Übungen"></nav>
  <footer>Fehlerdetektive · Fassung 1.0.2</footer>
</div>

<div class="seite uebung" id="uebung" hidden>

  <header>
    <button type="button" class="zurueck" id="zurueck">‹ Zur Auswahl</button>
    <div id="kopf"></div>

    <section class="ergebnis" id="ergebnis" hidden aria-live="polite" tabindex="-1"></section>
  </header>

  <div class="leiste" id="leiste" aria-live="polite">Markiert: <strong id="anzahl">0 Wörter</strong></div>

  <main class="textkarte" id="textkarte">
    <h2 id="titel"></h2>
    <div class="baender" id="baender" aria-hidden="true"></div>
    <div class="text" id="text"></div>
    <div class="blase" id="blase" role="status" hidden></div>
  </main>

  <div class="knoepfe">
    <button type="button" class="gross" id="auswerten">Auswerten</button>
    <button type="button" class="gross zweit" id="nochmal" hidden>Noch einmal versuchen</button>
  </div>
  <p class="naechstes" id="naechstes" hidden></p>

  <footer>Fehlerdetektive · Fassung 1.0.2</footer>
</div>

<script>
(function () {
  "use strict";

  /*
   * ÜBUNGSTEXT
   * ----------
   * Absätze werden durch eine Leerzeile getrennt.
   * Fehler stehen als [[TYP|falsche Form|richtige Form]]:
   *   N = Nomen absichtlich kleingeschrieben
   *   S = sonstiger Rechtschreibfehler
   * Die Kinder sehen nur die falsche Form. Buchstaben direkt hinter einer
   * Markierung gehören zum selben Wort: [[S|gelp|gelb]]es → „gelpes" (richtig: „gelbes").
   */
  var TEXT1 = [
    "Am Freitag macht unsere Klasse 4a einen [[N|ausflug|Ausflug]] in ein Naturschutzgebiet. Schon früh warten die Kinder auf dem [[N|schulhof|Schulhof]]. Einige halten ihre [[S|Hende|Hände]] tief in den Jackentaschen, denn die Luft ist kühl. Frau Berger prüft noch einmal die Liste, während die [[N|rucksäcke|Rucksäcke]] neben der Tür stehen. Unsere [[N|lehrerin|Lehrerin]] [[S|tregt|trägt]] an diesem Morgen selbst einen besonders großen Rucksack.",
    "",
    "Kurz darauf kommt der [[N|bus|Bus]]. Die Fahrt dauert nicht lange. Am Parkplatz erklärt ein Förster, wie wir uns im [[N|wald|Wald]] verhalten sollen. Dann beginnt die Wanderung. Auf einem schmalen [[N|weg|Weg]] rascheln trockene [[N|blätter|Blätter]] unter unseren Schuhen. Wir müssen vorsichtig [[S|geen|gehen]], weil dicke Wurzeln aus dem Boden ragen. Neben uns [[S|leuft|läuft]] ein kleiner Bach durch das Gelände.",
    "",
    "Der Förster erzählt, dass viele [[S|Welder|Wälder]] für Tiere und Pflanzen wichtig sind. Die hohen [[S|Beume|Bäume]] bieten vielen Vögeln Schutz. Auf einer Lichtung können wir sogar zwei Rehe [[S|seen|sehen]]. Ein besonders großer Baum ist [[S|elter|älter]] als unsere Schule. An einem umgestürzten Stamm müssen wir kurz [[S|steen|stehen]] bleiben.",
    "",
    "Später machen wir eine [[N|pause|Pause]]. Die Kinder holen ihre [[N|brote|Brote]] und [[N|flaschen|Flaschen]] heraus. Im Gras liegt ein [[S|gelp|gelb]]es Blatt, das aussieht wie ein Stern. Mia legt es vorsichtig in einen [[S|Korp|Korb]], den der Förster für Fundstücke mitgebracht hat. Ein [[S|Zweik|Zweig]] mit roten Beeren bleibt dagegen liegen.",
    "",
    "Nach der Pause taucht [[S|plözlich|plötzlich]] ein [[N|hund|Hund]] auf. Der freundliche Hund gehört zu einem [[N|spaziergänger|Spaziergänger]] und will offenbar mit uns spielen. Er springt bis an den [[N|bach|Bach]], während einige Enten dort [[S|schwimen|schwimmen]]. Der Förster bittet uns, ruhig zu bleiben und nicht an Ästen zu [[S|zien|ziehen]].",
    "",
    "Bald führt der [[S|Wek|Weg]] zu einer alten [[N|brücke|Brücke]]. Dort soll jede [[N|gruppe|Gruppe]] eine kleine Aufgabe lösen. Wir haben eine [[N|karte|Karte]] bekommen und sollen darauf verschiedene Stellen einzeichnen. Mia hat die Karte aus einem Umschlag [[S|genomen|genommen]]. Danach sollen alle Teams wieder zum Treffpunkt [[S|komen|kommen]]. Bei einem Bewegungsspiel dürfen wir uns anschließend im Kreis [[S|dreen|drehen]].",
    "",
    "Für den [[N|rückweg|Rückweg]] wählen wir einen anderen Pfad. Der Förster zeigt noch einmal auf den [[S|Walt|Wald]] und erklärt, warum wir keinen Müll zurücklassen dürfen. Am Nachmittag erreichen wir die [[N|schule|Schule]]. Alle sind müde, aber zufrieden. Es ist ein schöner [[N|tag|Tag]], an den sich die Klasse bestimmt noch lange erinnern wird."
  ].join("\n");

  var TEXT2 = "Am Dienstag beginnt der Unterricht wie immer. Als die Kinder das [[N|klassenzimmer|Klassenzimmer]] betreten, steht auf der Tafel ein rätselhafter Satz. Niemand weiß, wer ihn geschrieben hat. Frau König ist noch nicht da, und das [[N|fenster|Fenster]] neben ihrem Pult steht offen. Auf dem Boden liegt ein kleiner [[N|schlüssel|Schlüssel]]. Mia hebt ihn auf und ruft: „Vielleicht gehört er zu einer geheimen Tür!“ Ihr Freund Ben [[S|leuft|läuft]] sofort zur Garderobe.\n\nKurz darauf [[S|komt|kommt]] die [[N|lehrerin|Lehrerin]] herein. Sie betrachtet den Schlüssel und schüttelt den Kopf. „Der gehört mir nicht“, sagt sie. In diesem Moment entdeckt Ben in einer offenen [[N|schublade|Schublade]] einen gefalteten Zettel. Darauf steht: „Wer das Rätsel lösen will, muss den richtigen [[N|weg|Weg]] finden.“ Die Kinder werden neugierig. Frau König erlaubt der Klasse, in der ersten Stunde gemeinsam nachzuforschen.\n\nDer erste Hinweis führt sie in den Flur. Dort hängen bunte Bilder von Tieren, Häusern und [[S|Beumen|Bäumen]]. Unter einem Bild steckt ein zweiter Zettel. Lisa muss sich auf die Zehenspitzen stellen, um ihn zu [[S|seen|sehen]]. Auf dem Zettel ist eine kleine Karte gezeichnet. Ein roter Pfeil zeigt auf den [[N|schulhof|Schulhof]]. Also ziehen alle ihre Jacken an. Draußen ist es kühl, und viele Kinder stecken die [[S|Hende|Hände]] tief in die Taschen.\n\nAuf dem Schulhof führt die Spur zu einer Bank. Darunter steht ein alter [[N|rucksack|Rucksack]], den niemand aus der Klasse kennt. Frau König öffnet ihn vorsichtig. Darin liegen eine Lupe, ein Stück Schnur und ein [[N|brief|Brief]]. Ben will den Brief [[S|schnel|schnell]] öffnen, aber Mia hält ihn zurück. „Vielleicht sollten wir erst überlegen“, sagt sie. Schließlich liest Frau König die Nachricht vor. Sie sollen zum Büro des [[N|hausmeisters|Hausmeisters]] gehen.\n\nDer Hausmeister wartet bereits und grinst. „Ihr seid auf dem richtigen [[S|Wek|Weg]]“, sagt er. Neben ihm steht ein kleiner [[N|korb|Korb]] mit Kreidestücken. Eines davon ist [[S|gelp|gelb]], die anderen sind weiß. Auf dem gelben Stück steht winzig eine Zahl. Der Hausmeister erklärt, dass sie diese Zahl [[S|speter|später]] brauchen werden. Dann zeigt er zur [[N|treppe|Treppe]], die in den Keller führt.\n\nIm Keller ist es dunkel. Zum Glück liegt auf einem Regal eine [[N|taschenlampe|Taschenlampe]]. Mia schaltet sie ein. Ihr Licht fällt auf eine schwere [[N|tür|Tür]]. Daneben stehen alte Stühle, Kartons und Werkzeug. Ben entdeckt eine Holzkiste. „Die sieht wichtig aus!“, flüstert er. In der [[N|kiste|Kiste]] liegt wieder ein [[N|zettel|Zettel]]. Diesmal lautet die Aufgabe: „Ihr müsst fünf Schritte nach links gehen und dann ganz still [[S|steen|stehen]]. Danach sollt ihr euch dreimal im Kreis [[S|dreen|drehen]].“\n\nDie Kinder lachen, machen aber mit. [[S|Plözlich|Plötzlich]] bemerkt Lisa hinter einem Schrank einen schmalen Gang. „Den habe ich noch nie gesehen“, sagt sie. Frau König geht voran. Der Gang endet an einer zweiten Tür. Der Schlüssel vom Anfang passt tatsächlich. Dahinter befindet sich ein kleiner Raum, in dem alte Bücher, Spiele und Ordner lagern. Auf einem Tisch steht eine Schachtel mit der Aufschrift: „Nur für besonders gute Detektive“.\n\nIn der Schachtel liegen mehrere Karten. Auf jeder Karte steht eine Aufgabe. Eine [[N|gruppe|Gruppe]] muss Wörter verlängern, eine andere soll Wörter ableiten. Ben hat sofort eine Idee, aber er [[S|mus|muss]] warten, bis alle bereit sind. Eine Aufgabe lautet: „Welche Mehrzahl gehört zu Wald?“ Ben schreibt zunächst „[[S|Welder|Wälder]]“ auf sein Blatt. Bei einer anderen Aufgabe geht es um Menschen, die nachts [[S|treumen|träumen]].\n\nNachdem alle Aufgaben gelöst sind, finden die Kinder unter dem Tisch einen weiteren [[N|hinweis|Hinweis]]. Darauf steht, dass sie in ihre Klasse zurückkehren sollen. Auf dem Rückweg erzählt der Hausmeister, dass er die alte Kiste aus dem Fundraum [[S|genomen|genommen]] hat. Ben fragt ihn, ob er solche Rätsel [[S|imer|immer]] vorbereitet. Der Hausmeister lacht nur und sagt: „Heute war Frau König die Chefin.“\n\nVor der [[N|pause|Pause]] erklärt Frau König endlich alles. Sie hat das Rätsel gemeinsam mit dem Hausmeister vorbereitet, weil die Klasse in der [[S|nechsten|nächsten]] Zeit selbst Detektivgeschichten schreiben soll. Das [[N|geheimnis|Geheimnis]] ist also gelöst. Ben findet die Idee [[S|kluk|klug]] und möchte sofort zum nächsten Hinweis [[S|renen|rennen]]. Doch Frau König lacht: „Für heute reicht es. Jetzt beginnt erst einmal der normale Unterricht!“";

  /*
   * DIE ÜBUNGEN
   * Übung 1 ist seit Fassung 1.0.0 unverändert (Text und Anleitung).
   * Eine weitere Übung wird hier angehängt: Titel, Anleitung (HTML), Text.
   */
  var UEBUNGEN = [
    {
      titel: "Ein besonderer Herbsttag",
      kopf:
        '<h1>Fehlerdetektive <span class="lupe" aria-hidden="true">🔍</span> – Findest du alle Fehler?</h1>' +
        '<p class="auftrag">Im Text haben sich <strong>40 Rechtschreibfehler</strong> versteckt. Tippe auf jedes Wort, das deiner Meinung nach falsch geschrieben ist.</p>' +
        '<p class="auftrag achtung"><strong>Achtung:</strong> Viele schwierige Wörter sind vollkommen richtig geschrieben!</p>',
      text: TEXT1
    },
    {
      titel: "Das Rätsel im Schulhaus",
      kopf:
        '<h1>Fehlerdetektive aufgepasst! <span class="lupe" aria-hidden="true">🔍</span></h1>' +
        '<p class="auftrag">In diesem Text haben sich <strong>40 Rechtschreibfehler</strong> versteckt.</p>' +
        '<p class="auftrag">Tippe auf jedes Wort, das deiner Meinung nach falsch geschrieben ist.</p>' +
        '<p class="auftrag achtung"><strong>Aber Vorsicht:</strong> Viele schwierige Wörter sind vollkommen richtig geschrieben!</p>',
      text: TEXT2
    }
  ];

  var SOLL = { N: 20, S: 20, gesamt: 40 };

  /* ---------- Text zerlegen ---------- */

  // Markierung | Wort | Leerraum | Satzzeichen
  var MUSTER = /\[\[([NS])\|([^|\]]+)\|([^|\]]+)\]\]|([\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)*)|(\s+)|([^\s\p{L}\p{N}\[]+)/gu;

  function zerlegeAbsatz(absatz, probleme) {
    var teile = [];
    var gelesen = 0;
    var m;
    MUSTER.lastIndex = 0;
    while ((m = MUSTER.exec(absatz)) !== null) {
      if (m.index !== gelesen) {
        probleme.push("Unlesbare Stelle im Text: „" + absatz.slice(gelesen, m.index) + "“");
      }
      gelesen = MUSTER.lastIndex;
      if (m[1]) {
        teile.push({ art: "wort", text: m[2], richtig: m[3], typ: m[1] });
      } else if (m[4]) {
        teile.push({ art: "wort", text: m[4], richtig: m[4], typ: null });
      } else if (m[5]) {
        teile.push({ art: "leer", text: " " });
      } else {
        teile.push({ art: "zeichen", text: m[6] });
      }
    }
    if (gelesen !== absatz.length) {
      probleme.push("Unlesbares Textende: „" + absatz.slice(gelesen) + "“");
    }

    // Direkt aneinanderstoßende Wortteile zu EINEM Wort verbinden
    // (z. B. [[S|gelp|gelb]]es → „gelpes“ / „gelbes“).
    var verbunden = [];
    teile.forEach(function (t) {
      var vorher = verbunden[verbunden.length - 1];
      if (t.art === "wort" && vorher && vorher.art === "wort") {
        if (vorher.typ && t.typ) {
          probleme.push("Zwei Fehler in einem Wort: „" + vorher.text + t.text + "“");
        }
        vorher.text += t.text;
        vorher.richtig += t.richtig;
        vorher.typ = vorher.typ || t.typ;
      } else {
        verbunden.push(t);
      }
    });
    return verbunden;
  }

  function zerlegeText(text) {
    var probleme = [];
    var absaetze = text.split(/\n\s*\n/).map(function (a) { return a.trim(); }).filter(Boolean);
    var ergebnis = absaetze.map(function (a) { return zerlegeAbsatz(a, probleme); });
    return { absaetze: ergebnis, probleme: probleme };
  }

  /* ---------- Selbstprüfung beim Laden ---------- */

  function pruefe(woerter, probleme, titel) {
    var zahl = { N: 0, S: 0 };
    woerter.forEach(function (w) {
      if (!w.typ) return;
      zahl[w.typ]++;
      if (w.text === w.richtig) {
        probleme.push("Fehler ohne Unterschied: „" + w.text + "“");
      }
      if (w.typ === "N") {
        var gross = w.text.charAt(0).toUpperCase() + w.text.slice(1);
        if (w.text.charAt(0) === w.text.charAt(0).toUpperCase() || gross !== w.richtig) {
          probleme.push("N-Fehler ist keine reine Kleinschreibung: „" + w.text + "“ → „" + w.richtig + "“");
        }
      }
    });
    var gesamt = zahl.N + zahl.S;
    if (zahl.N !== SOLL.N) probleme.push("Typ N: " + zahl.N + " statt " + SOLL.N + " Fehler.");
    if (zahl.S !== SOLL.S) probleme.push("Typ S: " + zahl.S + " statt " + SOLL.S + " Fehler.");
    if (gesamt !== SOLL.gesamt) probleme.push("Insgesamt: " + gesamt + " statt " + SOLL.gesamt + " Fehler.");

    if (probleme.length) {
      console.error(
        "%c FEHLERDETEKTIVE „" + titel + "“ – DER ÜBUNGSTEXT STIMMT NICHT! %c\n\n" + probleme.join("\n") +
        "\n\nGezählt: N = " + zahl.N + ", S = " + zahl.S + ", gesamt = " + gesamt +
        " (erwartet: N = " + SOLL.N + ", S = " + SOLL.S + ", gesamt = " + SOLL.gesamt + ").",
        "background:#b3261e;color:#fff;font-size:16px;font-weight:bold;padding:4px 8px;",
        ""
      );
    } else {
      console.info("Fehlerdetektive „" + titel + "“: Text geprüft – " + zahl.N + " × N, " + zahl.S + " × S, insgesamt " + gesamt + " Fehler.");
    }
    return { N: zahl.N, S: zahl.S, gesamt: gesamt, ok: probleme.length === 0 };
  }

  /* ---------- Aufbau der Seite ---------- */

  var uebung = document.getElementById("uebung");
  var textEl = document.getElementById("text");
  var anzahlEl = document.getElementById("anzahl");
  var ergebnisEl = document.getElementById("ergebnis");
  var blase = document.getElementById("blase");
  var karte = document.getElementById("textkarte");
  var knopfAuswerten = document.getElementById("auswerten");
  var knopfNochmal = document.getElementById("nochmal");

  var auswahl = document.getElementById("auswahl");
  var kopf = document.getElementById("kopf");
  var titelEl = document.getElementById("titel");

  // Jede Übung wird beim Laden der Seite zerlegt und geprüft – nicht erst,
  // wenn ein Kind sie öffnet. Stimmt eine Fehlerzahl nicht, steht es sofort
  // in der Konsole.
  UEBUNGEN.forEach(function (u) {
    var zerlegt = zerlegeText(u.text);
    var liste = [];
    zerlegt.absaetze.forEach(function (teile) {
      teile.forEach(function (t) { if (t.art === "wort") liste.push(t); });
    });
    u.absaetze = zerlegt.absaetze;
    u.pruefung = pruefe(liste, zerlegt.probleme, u.titel);
  });

  // Die Lösung steht NUR hier im Skript – nicht an den Wort-Elementen.
  // Jedes Wort hat seine eigene Stelle: „Weg“ kann an einer Stelle richtig
  // und an einer anderen ein Fehler sein. Entschieden wird nach Position.
  var woerter = [];   // { text, richtig, typ }
  var spans = [];     // passende Elemente, gleiche Reihenfolge
  var markiert = [];  // true/false je Wort
  var ausgewertet = false;
  var offenesWort = -1;
  var FEHLERZAHL = 0;
  // Die Lösung kommt in Stufen (ab 1.0.2, Ansage des Nutzers 10/2026).
  // Jedes Prüfen geht eine Stufe weiter, dazwischen sucht das Kind weiter:
  //   1 = wie viele fehlen (gefunden grün, falsch markiert rot)
  //   2 = davon kleingeschriebene Nomen / andere
  //   3 = Zeilen, in denen noch Fehler stecken
  //   4 = die Lösung (übersehen orange, Schreibweise antippbar)
  var stufe = 0;
  var fehlendeZeilen = [];
  var baender = document.getElementById("baender");
  var naechstes = document.getElementById("naechstes");

  function textAufbauen(u) {
    woerter = [];
    spans = [];
    markiert = [];
    textEl.textContent = "";
    titelEl.textContent = u.titel;
    kopf.innerHTML = u.kopf;
    FEHLERZAHL = u.pruefung.gesamt;
    u.absaetze.forEach(function (teile) {
      var p = document.createElement("p");
      teile.forEach(function (t) {
        if (t.art === "wort") {
          var i = woerter.length;
          woerter.push({ text: t.text, richtig: t.richtig, typ: t.typ });
          var s = document.createElement("span");
          s.className = "w";
          s.textContent = t.text;
          s.setAttribute("role", "button");
          s.setAttribute("tabindex", "0");
          s.setAttribute("aria-pressed", "false");
          s.dataset.i = String(i);
          spans.push(s);
          markiert.push(false);
          p.appendChild(s);
        } else {
          p.appendChild(document.createTextNode(t.text));
        }
      });
      textEl.appendChild(p);
    });
  }

  /* ---------- Markieren ---------- */

  function zaehleMarkierte() {
    var n = 0;
    for (var i = 0; i < markiert.length; i++) if (markiert[i]) n++;
    return n;
  }

  function zeigeAnzahl() {
    var n = zaehleMarkierte();
    anzahlEl.textContent = n + (n === 1 ? " Wort" : " Wörter");
  }

  function umschalten(i) {
    markiert[i] = !markiert[i];
    // Grün/Rot vom letzten Prüfen gilt nach einer Änderung nicht mehr
    spans[i].classList.remove("gefunden", "falsch");
    spans[i].removeAttribute("aria-label");
    spans[i].classList.toggle("markiert", markiert[i]);
    spans[i].setAttribute("aria-pressed", markiert[i] ? "true" : "false");
    zeigeAnzahl();
  }

  function wortAngetippt(i) {
    if (ausgewertet) {
      zeigeKorrektur(i);
    } else {
      umschalten(i);
    }
  }

  textEl.addEventListener("click", function (e) {
    var s = e.target.closest ? e.target.closest(".w") : null;
    if (!s) return;
    e.stopPropagation();
    wortAngetippt(Number(s.dataset.i));
  });

  textEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var s = e.target.closest ? e.target.closest(".w") : null;
    if (!s) return;
    e.preventDefault();
    wortAngetippt(Number(s.dataset.i));
  });

  /* ---------- Einblendung der richtigen Schreibweise ---------- */

  function schliesseBlase() {
    if (offenesWort >= 0) spans[offenesWort].classList.remove("offen");
    offenesWort = -1;
    blase.hidden = true;
    blase.textContent = "";
  }

  function zeigeKorrektur(i) {
    var w = woerter[i];
    var istFehler = !!w.typ;
    if (!istFehler && !markiert[i]) { schliesseBlase(); return; }
    if (offenesWort === i) { schliesseBlase(); return; }
    schliesseBlase();

    blase.textContent = "";
    if (istFehler) {
      var alt = document.createElement("span");
      alt.className = "alt";
      alt.textContent = w.text;
      var neu = document.createElement("span");
      neu.className = "neu";
      neu.textContent = w.richtig;
      var hinweis = document.createElement("span");
      hinweis.className = "hinweis";
      hinweis.textContent = w.typ === "N"
        ? "Nomen schreibt man groß."
        : "So schreibt man das Wort richtig.";
      blase.appendChild(alt);
      blase.appendChild(document.createTextNode(" → "));
      blase.appendChild(neu);
      blase.appendChild(hinweis);
    } else {
      var richtig = document.createElement("strong");
      richtig.textContent = "„" + w.text + "“";
      blase.appendChild(richtig);
      blase.appendChild(document.createTextNode(" ist richtig geschrieben."));
    }

    offenesWort = i;
    spans[i].classList.add("offen");
    blase.hidden = false;

    // Unter das Wort setzen, innerhalb der Textkarte halten
    var k = karte.getBoundingClientRect();
    var rects = spans[i].getClientRects();
    var r = rects[rects.length - 1] || spans[i].getBoundingClientRect();
    var breite = blase.offsetWidth;
    var mitte = r.left + r.width / 2 - k.left;
    var links = Math.max(8, Math.min(mitte - breite / 2, k.width - breite - 8));
    blase.style.left = links + "px";
    blase.style.top = (r.bottom - k.top + 10) + "px";
    blase.style.setProperty("--pfeil", Math.max(16, Math.min(mitte - links, breite - 16)) + "px");
  }

  document.addEventListener("click", function (e) {
    if (offenesWort >= 0 && !blase.contains(e.target)) schliesseBlase();
  });
  // Drehen des iPads bricht die Zeilen neu um — die Bänder ziehen mit.
  window.addEventListener("resize", function () { schliesseBlase(); zeilenZeichnen(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") schliesseBlase();
  });

  /* ---------- Auswerten ---------- */

  function absatz(text, klasse) {
    var p = document.createElement("p");
    if (klasse) p.className = klasse;
    p.textContent = text;
    return p;
  }

  function zaehlen() {
    var z = { gefunden: 0, uebersehen: 0, falsch: 0, fehltN: 0, fehltS: 0, fehlend: [] };
    woerter.forEach(function (w, i) {
      if (w.typ && markiert[i]) z.gefunden++;
      else if (w.typ) { z.uebersehen++; z["fehlt" + w.typ]++; z.fehlend.push(i); }
      else if (markiert[i]) z.falsch++;
    });
    return z;
  }

  /*
   * Stufe 3: Bänder über die Zeilen, so wie sie auf DIESEM Bildschirm
   * umbrechen (hoch und quer verschieden) — daher bei jeder Größenänderung
   * neu. Ein Band geht über die ganze Textbreite, sonst verriete es das Wort.
   */
  function zeilenZeichnen() {
    baender.textContent = "";
    if (stufe !== 3 || ausgewertet || !fehlendeZeilen.length) return;
    var k = karte.getBoundingClientRect();
    var t = textEl.getBoundingClientRect();
    var mitten = [];
    fehlendeZeilen.forEach(function (i) {
      Array.prototype.forEach.call(spans[i].getClientRects(), function (r) {
        var m = (r.top + r.bottom) / 2;
        if (mitten.some(function (x) { return Math.abs(x - m) <= 4; })) return;
        mitten.push(m);
        var band = document.createElement("div");
        band.className = "band";
        band.style.top = (r.top - k.top - 2) + "px";
        band.style.height = (r.height + 4) + "px";
        band.style.left = (t.left - k.left - 10) + "px";
        band.style.width = (t.width + 20) + "px";
        baender.appendChild(band);
      });
    });
  }

  var NAECHSTES = [
    "",
    "Beim nächsten Prüfen erfährst du, wie viele davon kleingeschriebene Nomen sind und wie viele andere Fehler.",
    "Beim nächsten Prüfen siehst du, in welchen Zeilen noch Fehler stecken.",
    "Beim nächsten Prüfen siehst du die Lösung."
  ];

  function pruefen() {
    schliesseBlase();
    var z = zaehlen();
    stufe = Math.min(4, stufe + 1);
    if ((z.gefunden === FEHLERZAHL && z.falsch === 0) || stufe === 4) {
      auswerten();
      return;
    }
    // Gefunden grün, falsch markiert rot — die übersehenen bleiben verborgen
    woerter.forEach(function (w, i) {
      var s = spans[i];
      s.classList.remove("markiert", "gefunden", "falsch");
      s.removeAttribute("aria-label");
      if (!markiert[i]) return;
      s.classList.add(w.typ ? "gefunden" : "falsch");
      s.setAttribute("aria-label", w.text + " – " + (w.typ ? "Fehler gefunden" : "war richtig geschrieben"));
    });
    fehlendeZeilen = z.fehlend;

    ergebnisEl.textContent = "";
    ergebnisEl.classList.remove("perfekt");
    ergebnisEl.appendChild(absatz(z.gefunden === FEHLERZAHL
      ? "Super! Du hast alle " + FEHLERZAHL + " Fehler gefunden!"
      : "Du hast " + z.gefunden + " von " + FEHLERZAHL + " Fehlern gefunden.", "haupt"));
    if (z.uebersehen) {
      ergebnisEl.appendChild(absatz(z.uebersehen === 1
        ? "1 Fehler hast du noch nicht gefunden."
        : z.uebersehen + " Fehler hast du noch nicht gefunden."));
    }
    if (stufe >= 2 && z.uebersehen) {
      ergebnisEl.appendChild(absatz("Davon " +
        (z.fehltN === 1 ? "ist 1 ein kleingeschriebenes Nomen" : "sind " + z.fehltN + " kleingeschriebene Nomen") +
        " und " + (z.fehltS === 1 ? "1 ein anderer Fehler" : z.fehltS + " andere Fehler") + ".", "tippzeile"));
    }
    if (stufe >= 3 && z.uebersehen) {
      ergebnisEl.appendChild(absatz("In den gelb hinterlegten Zeilen steckt noch mindestens ein Fehler.", "tippzeile"));
    }
    ergebnisEl.appendChild(absatz(z.falsch
      ? (z.falsch === 1 ? "1 richtiges Wort" : z.falsch + " richtige Wörter") + " hast du versehentlich markiert (rot)."
      : "Du hast kein richtiges Wort versehentlich markiert."));
    var legende = document.createElement("ul");
    legende.className = "legende";
    [["gefunden", "gefunden"], ["falsch", "war richtig"]].forEach(function (e) {
      var li = document.createElement("li");
      var probe = document.createElement("span");
      probe.className = "probe " + e[0];
      probe.setAttribute("aria-hidden", "true");
      li.appendChild(probe);
      li.appendChild(document.createTextNode(e[1]));
      legende.appendChild(li);
    });
    ergebnisEl.appendChild(legende);
    ergebnisEl.appendChild(absatz("Such weiter! Du kannst weiter Wörter antippen – auch rote, um sie abzuwählen.", "tipp"));
    ergebnisEl.hidden = false;

    knopfAuswerten.textContent = "Noch einmal prüfen";
    naechstes.textContent = NAECHSTES[stufe];
    naechstes.hidden = false;
    zeilenZeichnen();
    ergebnisEl.scrollIntoView({ block: "start" });
    ergebnisEl.focus({ preventScroll: true });
  }

  /* Stufe 4 – oder vorher, wenn alles gefunden ist: die ganze Lösung. */
  function auswerten() {
    stufe = 4;
    fehlendeZeilen = [];
    baender.textContent = "";
    naechstes.hidden = true;
    var gefunden = 0, uebersehen = 0, falsch = 0;
    woerter.forEach(function (w, i) {
      var s = spans[i];
      var klasse = null, beschreibung = "";
      s.classList.remove("markiert", "gefunden", "falsch");
      s.removeAttribute("aria-label");
      if (w.typ && markiert[i]) {
        gefunden++; klasse = "gefunden";
        beschreibung = "Fehler gefunden. Richtig: " + w.richtig;
      } else if (w.typ) {
        uebersehen++; klasse = "uebersehen";
        beschreibung = "Fehler übersehen. Richtig: " + w.richtig;
      } else if (markiert[i]) {
        falsch++; klasse = "falsch";
        beschreibung = "war richtig geschrieben";
      }
      if (klasse) {
        s.classList.add(klasse);
        s.setAttribute("aria-label", w.text + " – " + beschreibung);
      } else {
        s.removeAttribute("role");
        s.setAttribute("tabindex", "-1");
      }
      s.removeAttribute("aria-pressed");
    });

    ausgewertet = true;
    uebung.classList.add("ausgewertet");

    ergebnisEl.textContent = "";
    ergebnisEl.classList.remove("perfekt");

    if (gefunden === FEHLERZAHL && falsch === 0) {
      ergebnisEl.classList.add("perfekt");
      ergebnisEl.appendChild(absatz("Fantastisch! Du hast alle " + FEHLERZAHL + " Fehler gefunden! 🎉", "haupt"));
      ergebnisEl.appendChild(absatz("Und du hast kein einziges richtiges Wort markiert. Ein echter Fehlerdetektiv!"));
    } else {
      ergebnisEl.appendChild(absatz(
        gefunden === FEHLERZAHL
          ? "Super! Du hast alle " + FEHLERZAHL + " Fehler gefunden!"
          : "Du hast " + gefunden + " von " + FEHLERZAHL + " Fehlern gefunden.",
        "haupt"));
      if (uebersehen > 0) {
        ergebnisEl.appendChild(absatz(uebersehen === 1
          ? "1 Fehler hast du übersehen. Er ist jetzt orange."
          : uebersehen + " Fehler hast du übersehen. Sie sind jetzt orange."));
      }
      if (falsch > 0) {
        ergebnisEl.appendChild(absatz(falsch === 1
          ? "1 richtiges Wort hast du versehentlich markiert."
          : falsch + " richtige Wörter hast du versehentlich markiert."));
      } else {
        ergebnisEl.appendChild(absatz("Du hast kein richtiges Wort versehentlich markiert."));
      }
    }

    var legende = document.createElement("ul");
    legende.className = "legende";
    [["gefunden", "gefunden"], ["uebersehen", "übersehen"], ["falsch", "war richtig"]].forEach(function (e) {
      var li = document.createElement("li");
      var probe = document.createElement("span");
      probe.className = "probe " + e[0];
      probe.setAttribute("aria-hidden", "true");
      li.appendChild(probe);
      li.appendChild(document.createTextNode(e[1]));
      legende.appendChild(li);
    });
    ergebnisEl.appendChild(legende);
    ergebnisEl.appendChild(absatz("Tippe auf ein farbiges Wort, um die richtige Schreibweise zu sehen.", "tipp"));

    ergebnisEl.hidden = false;
    knopfAuswerten.hidden = true;
    knopfNochmal.hidden = false;

    ergebnisEl.scrollIntoView({ block: "start" });
    ergebnisEl.focus({ preventScroll: true });
  }

  /* ---------- Zurücksetzen ---------- */

  function zuruecksetzen() {
    schliesseBlase();
    ausgewertet = false;
    stufe = 0;
    fehlendeZeilen = [];
    baender.textContent = "";
    knopfAuswerten.textContent = "Auswerten";
    naechstes.hidden = true;
    uebung.classList.remove("ausgewertet");
    spans.forEach(function (s, i) {
      markiert[i] = false;
      s.className = "w";
      s.setAttribute("role", "button");
      s.setAttribute("tabindex", "0");
      s.setAttribute("aria-pressed", "false");
      s.removeAttribute("aria-label");
    });
    ergebnisEl.hidden = true;
    ergebnisEl.textContent = "";
    ergebnisEl.classList.remove("perfekt");
    knopfAuswerten.hidden = false;
    knopfNochmal.hidden = true;
    zeigeAnzahl();
    window.scrollTo(0, 0);
  }

  knopfAuswerten.addEventListener("click", pruefen);
  knopfNochmal.addEventListener("click", zuruecksetzen);

  /* ---------- Auswahl der Übungen ---------- */

  var wahl = document.getElementById("wahl");
  UEBUNGEN.forEach(function (u, nr) {
    var knopf = document.createElement("button");
    knopf.type = "button";
    knopf.className = "wahlknopf";
    knopf.innerHTML = '<span class="wahlknopf__nummer"></span><span class="wahlknopf__titel"></span><span class="wahlknopf__pfeil" aria-hidden="true">›</span>';
    knopf.children[0].textContent = "Übung " + (nr + 1);
    knopf.children[1].textContent = u.titel;
    knopf.addEventListener("click", function () { kamVonAuswahl = true; location.hash = "#uebung" + (nr + 1); });
    wahl.appendChild(knopf);
  });

  // Kam das Kind über die Auswahl hierher, führt „Zur Auswahl“ denselben
  // Schritt zurück wie die Zurück-Geste. Wurde die Übung direkt als Link
  // geöffnet, gibt es diesen Schritt nicht – history.back() verließe dann
  // die Seite.
  var kamVonAuswahl = false;
  document.getElementById("zurueck").addEventListener("click", function () {
    if (kamVonAuswahl) { kamVonAuswahl = false; history.back(); }
    else location.hash = "";
  });

  // Der Weg steht in der Adresse (#uebung1, #uebung2), damit die
  // Zurück-Geste in Safari wieder zur Auswahl führt statt von der Seite weg.
  var offeneUebung = -1;
  function wegLesen() {
    var m = /^#uebung(\d+)$/.exec(location.hash);
    var nr = m ? Number(m[1]) - 1 : -1;
    if (nr < 0 || nr >= UEBUNGEN.length) {
      zuruecksetzen();
      offeneUebung = -1;
      uebung.hidden = true;
      auswahl.hidden = false;
      window.scrollTo(0, 0);
      return;
    }
    if (nr === offeneUebung) return;
    offeneUebung = nr;
    textAufbauen(UEBUNGEN[nr]);
    zuruecksetzen();
    auswahl.hidden = true;
    uebung.hidden = false;
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", wegLesen);
  wegLesen();
})();
</script>
</body>
</html>
