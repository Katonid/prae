# Übersetzt die Versuchsfassung „Klassenraum" auf einem macOS-Läufer, sobald
# etwas an KlassenraumiOS/ gepusht wird.
#
# ACHTUNG, zwei Dinge heißen hier ähnlich:
#   * `klassenraum/`      — die Web-App (kein Bau nötig, läuft über pages.yml)
#   * `KlassenraumiOS/`   — diese iOS-Versuchsfassung
#
# Wozu die Versuchsfassung da ist, steht in KlassenraumiOS/README.md.
name: Klassenraum bauen

on:
  push:
    paths:
      - 'KlassenraumiOS/**'
      - '.github/workflows/klassenraum-ios-build.yml'
  workflow_dispatch:

concurrency:
  group: klassenraum-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Übersetzen (iOS-Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          # Vollständige Historie: Die Bauphase „Build-Nummer setzen"
          # zählt daraus die Commits.
          fetch-depth: 0

      - name: Quelltext vorprüfen
        run: python3 scripts/swift-quelltext-pruefen.py .

      - name: Ressourcennamen auf Dopplung prüfen
        run: |
          # Xcode legt alle Ressourcen FLACH ins App-Bündel: Zwei Dateien
          # gleichen Namens in verschiedenen Unterordnern überschreiben sich
          # und lassen den Bau scheitern („duplicate output file"). Das
          # passiert leicht, weil der synchronisierte Ordner jede Datei
          # mitnimmt — einmal mit zwei README.md geschehen.
          python3 - <<'PY'
          import collections, os, sys

          wurzel = "KlassenraumiOS/Klassenraum"
          namen = collections.defaultdict(list)
          for ordner, _, dateien in os.walk(wurzel):
              # Der Asset-Katalog wird eigens übersetzt, nicht flach kopiert.
              if ".xcassets" in ordner:
                  continue
              for datei in dateien:
                  if datei.endswith(".swift") or datei == ".DS_Store":
                      continue
                  namen[datei].append(os.path.join(ordner, datei))

          doppelt = {n: p for n, p in namen.items() if len(p) > 1}
          if doppelt:
              for name, pfade in sorted(doppelt.items()):
                  print(f"{name} liegt mehrfach:")
                  for pfad in pfade:
                      print(f"    {pfad}")
              sys.exit("Gleiche Ressourcennamen — im Bündel würden sie sich überschreiben.")
          print(f"{len(namen)} Ressourcen, alle Namen eindeutig.")
          PY

      - name: Werkzeuge zeigen
        run: |
          xcodebuild -version
          sw_vers

      - name: Klassenraum übersetzen
        run: |
          set -o pipefail
          xcodebuild build \
            -project KlassenraumiOS/Klassenraum.xcodeproj \
            -target Klassenraum \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/klassenraum-ios-build.log

      - name: Fehler und Warnungen zusammenfassen
        if: always()
        run: |
          echo "===== Fehler ====="
          grep -E "error:" /tmp/klassenraum-ios-build.log | sort -u | head -60 || echo "keine"
          echo "===== Warnungen ====="
          grep -E "warning:" /tmp/klassenraum-ios-build.log | sort -u | head -40 || echo "keine"

      - name: Vollständiges Protokoll sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: klassenraum-ios-build-log
          path: /tmp/klassenraum-ios-build.log

  start:
    name: Starten (Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulator wählen
        id: sim
        run: |
          # Irgendein iPad reicht; die Startprüfung fragt nicht nach der Größe.
          LISTE=$(xcrun simctl list devices available)
          UDID=$(echo "$LISTE" | grep -F "iPad" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(echo "$LISTE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          fi
          if [ -z "$UDID" ]; then
            echo "::error::Kein Simulator vorhanden"; echo "$LISTE"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: App bauen
        working-directory: KlassenraumiOS
        run: |
          set -o pipefail
          # Ad-hoc-Signatur ("-"): sonst fehlen der App im Simulator ihre
          # Berechtigungen und CloudKit beendet den Prozess beim Start.
          xcodebuild \
            -project Klassenraum.xcodeproj \
            -scheme Klassenraum \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-start \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            build | tail -20

      - name: Starten und nachsehen, ob die App steht
        run: |
          # Diese Stufe fängt, was der Übersetzer nicht sehen kann: eine
          # Info.plist, die den Start verhindert. Der Szeneneintrag für den
          # Beamer sitzt genau dort — ein Tippfehler darin ließe die App
          # sauber übersetzen und trotzdem ins Schwarze starten.
          UDID="${{ steps.sim.outputs.udid }}"
          mit_grenze() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          mit_grenze 120 xcrun simctl boot "$UDID" || true
          mit_grenze 240 xcrun simctl bootstatus "$UDID" -b || echo "bootstatus abgebrochen — weiter"
          mit_grenze 150 xcrun simctl install "$UDID" \
            KlassenraumiOS/build-start/Build/Products/Debug-iphonesimulator/Klassenraum.app

          PID=$(mit_grenze 90 xcrun simctl launch "$UDID" de.familie.klassenraum | grep -oE '[0-9]+$' || true)
          if [ -z "$PID" ]; then
            echo "::error::Die App ließ sich nicht starten."
            exit 1
          fi
          echo "Gestartet mit Kennung $PID."

          # Zwölf Sekunden stehen bleiben: Ein Absturz beim Aufbau der Szenen
          # passiert sofort, nicht nach Minuten.
          sleep 12
          if ! ps -p "$PID" > /dev/null 2>&1; then
            echo "::error::Die App ist nach dem Start wieder verschwunden."
            mit_grenze 60 xcrun simctl spawn "$UDID" log show --last 2m --style compact \
              --predicate 'process == "Klassenraum"' | tail -60 || true
            exit 1
          fi
          echo "Die App läuft noch — Start in Ordnung."

          mkdir -p start
          mit_grenze 60 xcrun simctl io "$UDID" screenshot start/start.png || true

      - name: Bild vom Start ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassenraum-ios-start
          path: start
          if-no-files-found: warn
