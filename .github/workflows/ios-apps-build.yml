# Übersetzt alle iOS-Apps dieses Repos auf macOS-Läufern. Jede App läuft in
# einem eigenen Auftrag (fail-fast: false), damit ein Fehler in einer App die
# anderen nicht verdeckt.
name: iOS-Apps bauen

on:
  push:
    paths:
      - '**/*.xcodeproj/**'
      - '**/*.swift'
      - '**/*.plist'
      - '**/*.entitlements'
      - '.github/workflows/ios-apps-build.yml'
  pull_request:
    paths:
      - '**/*.xcodeproj/**'
      - '**/*.swift'
      - '**/*.plist'
      - '**/*.entitlements'
      - '.github/workflows/ios-apps-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ordner: CadUsdEuriOS,      app: CadUsdEur }
          - { ordner: Canada2026iOS,     app: Canada2026 }
          - { ordner: FlightMateiOS,     app: FlightMate }
          - { ordner: HimmelskompassiOS, app: Himmelskompass }
          - { ordner: KartenwalletiOS,   app: Kartenwallet }
          - { ordner: PhotoSpotRadariOS, app: PhotoSpotRadar }
          - { ordner: ReisekasseiOS,     app: Reisekasse }
          - { ordner: SoundboardiOS,     app: Soundboard }
          - { ordner: TafelbildiOS,      app: Tafelbild }
          - { ordner: TagesspuriOS,      app: Tagesspur }
          - { ordner: TankbuchiOS,       app: Tankbuch }

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          # Vollständige Historie: Manche Projekte zählen daraus die Build-Nummer.
          fetch-depth: 0

      - name: Werkzeuge zeigen
        run: xcodebuild -version

      - name: ${{ matrix.app }} übersetzen
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ matrix.ordner }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/build.log

      - name: Fehler und Warnungen zusammenfassen
        if: always()
        run: |
          echo "===== Fehler ====="
          grep -E "error:" /tmp/build.log | sort -u | head -60 || echo "keine"
          echo "===== Warnungen ====="
          grep -E "warning:" /tmp/build.log | grep -v "AppIntents.framework" | sort -u | head -40 || echo "keine"

      - name: Vollständiges Protokoll sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.app }}
          path: /tmp/build.log
