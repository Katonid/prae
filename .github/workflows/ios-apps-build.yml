# Übersetzt die iOS-Apps dieses Repos auf macOS-Läufern.
#
# **Gebaut wird nur, was sich geändert hat.** Vorher horchte dieser Ablauf
# auf `**/*.swift` und baute daraufhin ALLE elf Apps — eine Änderung an
# Tafelbild ließ also zehn fertige Apps sinnlos neu übersetzen, jede auf
# einem eigenen macOS-Läufer. Weil nur wenige davon gleichzeitig laufen
# dürfen, warteten die Aufträge aufeinander (gemessen 2,7 bis 5,7 Minuten
# je Auftrag), und der Bau, auf den es ankam, stand hinten an.
#
# Welche Apps gemeint sind, entscheidet `.github/scripts/welche-apps.py` —
# dort steht auch, wann trotzdem alles gebaut wird.
#
# Von Hand bauen: Reiter „Actions" → „iOS-Apps bauen" → „Run workflow" →
# App auswählen (oder „alle").
#
# Jede App läuft in einem eigenen Auftrag (fail-fast: false), damit ein
# Fehler in einer App die anderen nicht verdeckt.
name: iOS-Apps bauen

on:
  push:
    paths:
      - '**/*.xcodeproj/**'
      - '**/*.swift'
      - '**/*.plist'
      - '**/*.entitlements'
      - '.github/workflows/ios-apps-build.yml'
      - '.github/scripts/welche-apps.py'
  pull_request:
    paths:
      - '**/*.xcodeproj/**'
      - '**/*.swift'
      - '**/*.plist'
      - '**/*.entitlements'
      - '.github/workflows/ios-apps-build.yml'
      - '.github/scripts/welche-apps.py'
  workflow_dispatch:
    inputs:
      app:
        description: 'Welche App bauen?'
        type: choice
        default: alle
        options:
          - alle
          - Abfahrtstafel
          - Alarm
          - Anstoss
          - CadUsdEur
          - Fernweh
          - FlightMate
          - Himmelskompass
          - Kartenwallet
          - PhotoSpotRadar
          - Reisekasse
          - Routenplaner
          - Soundboard
          - Tafelbild
          - Tagesspur
          - Tankbuch
          - Urlaubstagebuch

concurrency:
  group: ios-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vorbereiten:
    name: Welche Apps?
    # Läuft auf Linux: Diese Auswahl kostet Sekunden und soll keinen
    # macOS-Läufer belegen, von denen es nur wenige gibt.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.waehlen.outputs.matrix }}
      anzahl: ${{ steps.waehlen.outputs.anzahl }}
      grund: ${{ steps.waehlen.outputs.grund }}
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          # Vollständige Historie: Ohne sie lässt sich nicht vergleichen,
          # was dieser Anstoß geändert hat.
          fetch-depth: 0

      - name: Auswählen
        id: waehlen
        env:
          EREIGNIS: ${{ github.event_name }}
          WUNSCH: ${{ inputs.app }}
          VORHER: ${{ github.event.before }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/welche-apps.py >> "$GITHUB_OUTPUT"

      - name: Ergebnis anzeigen
        run: |
          echo "### ${{ steps.waehlen.outputs.grund }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Aufträge auf macOS: ${{ steps.waehlen.outputs.anzahl }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.app }}
    needs: vorbereiten
    # Ohne diesen Riegel scheitert der Auftrag an einer leeren Matrix,
    # statt einfach ausgelassen zu werden.
    if: needs.vorbereiten.outputs.anzahl != '0'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.vorbereiten.outputs.matrix) }}

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          # Vollständige Historie: Manche Projekte zählen daraus die Build-Nummer.
          fetch-depth: 0

      - name: Quelltext vorprüfen
        run: python3 scripts/swift-quelltext-pruefen.py .

      - name: Werkzeuge zeigen
        run: xcodebuild -version

      - name: ${{ matrix.app }} übersetzen
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ matrix.ordner }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/build.log

      # ALS MAC-APP ÜBERSETZEN — für jede App, die es kann.
      #
      # Welche das sind, steht im Projekt selbst (`SUPPORTS_MACCATALYST`)
      # und nicht in einer Liste hier: Eine zweite Liste liefe auseinander,
      # sobald eine App dazukommt oder wegfällt.
      #
      # Das ist kein Beiwerk. Mac Catalyst übersetzt gegen ein ANDERES SDK,
      # und eine Schnittstelle, die es dort nicht gibt, fällt erst hier auf
      # — auf dem Mac des Nutzers wäre es ein roter Bau statt einer App.
      # Signiert wird auch hier nicht; was mit Profilen und Rechten zu tun
      # hat, sieht dieser Bau so wenig wie der für iOS.
      - name: ${{ matrix.app }} als Mac-App übersetzen
        id: mac
        run: |
          projekt="${{ matrix.ordner }}/${{ matrix.app }}.xcodeproj/project.pbxproj"
          if ! grep -q "SUPPORTS_MACCATALYST = YES" "$projekt"; then
            echo "Diese App ist nicht für den Mac gebaut - uebersprungen."
            exit 0
          fi
          set -o pipefail
          xcodebuild build \
            -project "${{ matrix.ordner }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/mac-build.log

      - name: Fehler und Warnungen zusammenfassen
        if: always()
        run: |
          echo "===== Fehler ====="
          grep -hE "error:" /tmp/build.log /tmp/mac-build.log 2>/dev/null | sort -u | head -60 || echo "keine"
          echo "===== Warnungen ====="
          grep -hE "warning:" /tmp/build.log /tmp/mac-build.log 2>/dev/null | grep -v "AppIntents.framework" | sort -u | head -40 || echo "keine"

      - name: Vollständiges Protokoll sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.app }}
          path: |
            /tmp/build.log
            /tmp/mac-build.log
