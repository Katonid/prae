name: Notfallalarm bauen

# Läuft auf einem Linux-Läufer, nicht auf macOS: Android braucht keinen Mac, und
# die knappen macOS-Läufer bleiben so für die iOS-Apps frei.
# Nur auf push, NICHT zusätzlich auf pull_request: Beides zusammen baut jeden
# Stand zweimal, weil ein Push auf einen Zweig mit offenem PR beide Auslöser
# bedient. Der Push-Lauf erscheint am PR genauso.
on:
  push:
    paths:
      - 'NotfallalarmAndroid/**'
      - '.github/workflows/notfallalarm-build.yml'
  workflow_dispatch:

# Ein neuer Push macht den vorherigen Lauf desselben Zweiges überflüssig.
concurrency:
  group: notfallalarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    name: Übersetzen und prüfen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NotfallalarmAndroid

    steps:
      - uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # google-services.json liegt nicht im Repo. Der Bau setzt von selbst die
      # Platzhalter-Vorlage ein; die App zeigt damit zur Laufzeit einen roten
      # Kasten, übersetzt aber vollständig.
      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests laufen lassen
        run: ./gradlew testDebugUnitTest

      # Kein Byte-Vergleich: sin() und tanh() dürfen sich zwischen C-Bibliotheken
      # im letzten Bit unterscheiden, und nach der Wandlung auf 16 Bit kann das
      # einen einzelnen Wert um eins kippen. Ein Byte-Vergleich schlüge dann auf
      # einer anderen Maschine ohne echten Grund fehl.
      - name: Alarmtöne gegenprüfen
        run: python3 scripts/toene-pruefen.py

      - name: Fehler und Warnungen zusammenfassen
        if: always()
        run: |
          echo "APK:"; ls -la app/build/outputs/apk/debug/ || true

      - name: Debug-APK sichern
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notfallalarm-debug-apk
          path: NotfallalarmAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
