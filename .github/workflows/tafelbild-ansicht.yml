# Baut die Tafelbild-App, startet sie in einem iPad-Simulator und legt
# Bildschirmfotos als Anhang ab. Damit lässt sich das Aussehen der App
# prüfen, ohne einen Mac zur Hand zu haben.
name: Tafelbild ansehen

on:
  workflow_dispatch:
  push:
    paths:
      - 'TafelbildiOS/Tafelbild/Views/**'
      - '.github/workflows/tafelbild-ansicht.yml'

concurrency:
  group: tafelbild-ansicht-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansicht:
    name: Bildschirmfotos (${{ matrix.geraet }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      # Beide Geräte, weil die App auf beiden anders aussieht: Am Telefon
      # zeigt sie dieselbe Tafel, nur kleiner und zoombar. Ein Fehlschlag
      # soll das andere Gerät nicht mitreißen.
      fail-fast: false
      matrix:
        geraet: [iPad, iPhone]

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulator wählen
        id: sim
        run: |
          # Ein Gerät der gewünschten Art nehmen — welches genau, entscheidet
          # der Läufer je nach installiertem Xcode.
          ART="${{ matrix.geraet }}"
          UDID=$(ART="$ART" xcrun simctl list devices available -j \
            | ART="$ART" python3 -c "import sys,json,os;a=os.environ['ART'];d=json.load(sys.stdin)['devices'];print(next((x['udid'] for rt in d for x in d[rt] if a in x['name']), ''))")
          if [ -z "$UDID" ]; then
            echo "Kein $ART-Simulator gefunden"; xcrun simctl list devices available; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: App bauen
        working-directory: TafelbildiOS
        run: |
          set -o pipefail
          # Bewusst mit Ad-hoc-Signatur ("-"): Nur dann bekommt die App im
          # Simulator ihre Berechtigungen. Ohne sie beendet CloudKit den
          # Prozess gleich beim Start.
          xcodebuild \
            -project Tafelbild.xcodeproj \
            -scheme Tafelbild \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            build | tail -30

      - name: App starten
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p ansicht
          # Jeder simctl-Aufruf bekommt eine Zeitgrenze: Der Simulator bleibt
          # auf geteilten Läufern gelegentlich stehen, und ohne Grenze steht
          # dann der ganze Lauf bis zum Zeitlimit.
          mit_grenze() { perl -e 'alarm shift; exec @ARGV' "$@"; }

          mit_grenze 120 xcrun simctl boot "$UDID" || true
          mit_grenze 240 xcrun simctl bootstatus "$UDID" -b || echo "bootstatus abgebrochen — weiter"
          mit_grenze 150 xcrun simctl install "$UDID" \
            TafelbildiOS/build-sim/Build/Products/Debug-iphonesimulator/Tafelbild.app
          # Ohne iCloud-Konto braucht der Abgleich nicht zu laufen; so steht
          # die Beispieltafel sofort und es gibt nichts zu warten.
          mit_grenze 60 xcrun simctl spawn "$UDID" defaults write de.familie.tafelbild syncEnabled -bool NO || true
          # Protokoll der App mitschneiden, damit ein Fehlstart erklärbar ist.
          xcrun simctl spawn "$UDID" log stream --level debug \
            --predicate 'processImagePath CONTAINS "Tafelbild"' > ansicht/protokoll.txt 2>&1 &
          sleep 3
          mit_grenze 90 xcrun simctl launch "$UDID" de.familie.tafelbild || true
          sleep 20

      - name: Bildschirmfotos aufnehmen
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p ansicht
          # simctl bleibt gelegentlich hängen und blockiert dann den ganzen
          # Lauf. macOS bringt kein GNU-timeout mit; perl kann dasselbe.
          shot() {
            for versuch in 1 2 3; do
              if perl -e 'alarm 45; exec @ARGV' xcrun simctl io "$UDID" screenshot "$1"; then
                echo "Bildschirmfoto $1 aufgenommen"
                return 0
              fi
              echo "Bildschirmfoto $1 fehlgeschlagen (Versuch $versuch)"
              sleep 4
            done
            return 0
          }
          shot "ansicht/01-${{ matrix.geraet }}.png"
          sleep 6
          shot "ansicht/02-${{ matrix.geraet }}.png"

      - name: Absturzberichte einsammeln
        if: always()
        run: |
          mkdir -p ansicht
          echo "--- läuft die App noch? ---" | tee ansicht/diagnose.txt
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" launchctl list 2>/dev/null \
            | grep -i tafelbild | tee -a ansicht/diagnose.txt || echo "nicht in der Liste" | tee -a ansicht/diagnose.txt
          echo "--- Absturzberichte ---" | tee -a ansicht/diagnose.txt
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -20 | tee -a ansicht/diagnose.txt || true
          for f in ~/Library/Logs/DiagnosticReports/Tafelbild*; do
            [ -e "$f" ] || continue
            cp "$f" ansicht/ || true
          done
          ls -la ansicht

      - name: Bilder ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tafelbild-ansicht-${{ matrix.geraet }}
          path: ansicht/
